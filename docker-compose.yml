name: modelo-predictivo

# Módulo Sinergia · Modelo Predictivo — despliegue completo con un comando:
#   cp .env.example .env   &&   docker compose up -d --build
#
# Servicios:
#   postgres   -> BBDD (esquema de salida creado por db/init)
#   predictor  -> job diario que entrena y predice (escribe en postgres)
#   api        -> API REST que sirve los resultados al frontal
#   frontend   -> frontal Angular (nginx) en http://localhost:${FRONTEND_PORT}

x-backend: &backend
  build: ./backend
  image: pid-modelo-predictivo-backend:local
  env_file: .env
  environment:
    CONFIG_DIR: /config
    DB_HOST: postgres
    DB_PORT: "5432"
  volumes:
    - ./config:/config:ro
    - ./backend/results:/app/results
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  predictor:
    <<: *backend
    # entrypoint por defecto = job diario del modelo

  api:
    <<: *backend
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/src"]
    entrypoint: []
    expose:
      - "8000"

  frontend:
    build: ./frontend
    image: pid-modelo-predictivo-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # Assets de marca sobreescribibles sin reconstruir (logo, fondo, favicon).
      - ./config/branding:/usr/share/nginx/html/assets/branding:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
