# CI: build & push de las dos imágenes (backend + frontend) al registry del PID.
stages:
  - build

.kaniko: &kaniko
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"${CI_REGISTRY}":{"username":"${CI_REGISTRY_USER}","password":"${CI_REGISTRY_PASSWORD}"}}}
      EOF
  tags:
    - docker

build-backend:
  <<: *kaniko
  script: |
    set -e
    TAG="${CI_COMMIT_TAG:-latest}"
    /kaniko/executor \
      --context "${CI_PROJECT_DIR}/backend" \
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" \
      --destination "${CI_REGISTRY_IMAGE}/backend:${TAG}" \
      --destination "${CI_REGISTRY_IMAGE}/backend:latest" \
      --destination "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}" \
      --cache=true --cache-repo "${CI_REGISTRY_IMAGE}/backend/cache"

build-frontend:
  <<: *kaniko
  script: |
    set -e
    TAG="${CI_COMMIT_TAG:-latest}"
    /kaniko/executor \
      --context "${CI_PROJECT_DIR}/frontend" \
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile" \
      --destination "${CI_REGISTRY_IMAGE}/frontend:${TAG}" \
      --destination "${CI_REGISTRY_IMAGE}/frontend:latest" \
      --destination "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}" \
      --cache=true --cache-repo "${CI_REGISTRY_IMAGE}/frontend/cache"
